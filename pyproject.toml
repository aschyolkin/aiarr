[project]
name = "media-acquisition-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
  "pydantic-settings==2.7.1", "sqlalchemy==2.0.36", "alembic==1.14.1",
  "httpx==0.28.1", "guessit==4.4.0", "qbittorrent-api==2026.8.1",
  "defusedxml==0.7.1", "beautifulsoup4==4.13.4", "bencodepy==0.9.5",
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "respx==0.22.0"]
[project.scripts]
mae = "mae.cli:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: external services and explicit credentials required"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.hatch.build.targets.wheel]
packages = ["mae"]
